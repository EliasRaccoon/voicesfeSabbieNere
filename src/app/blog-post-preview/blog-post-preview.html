<div class="blogpostpreview">
    <h3> {{post().title}}</h3>
    <h4> Pubblicato il {{post().date}} da {{post().blog.blogger.nickname}}</h4>
    @for(paragraph of paragraphs(); track paragraph.n){
        <p>{{paragraph.text}}</p>
    }
    <!-- non funzionante -->
    <a routerLink="readmore"> Leggi </a>
</div>
